<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Flex Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--brand:#2B4642;--brand-deep:#1F3431;--sun:#F4B740;--page:#F7F6F1;--card:rgba(255,255,255,.72);--ink:#15201E;--muted:#66726F;--line:#E1DED3;--err:#B3261E;--field:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0E1413;--card:rgba(23,33,31,.72);--ink:#EEF2F0;--muted:#9AA6A3;--line:#2A3633;--err:#F2B8B5;--field:#0E1413}}
:root[data-theme="dark"]{--page:#0E1413;--card:rgba(23,33,31,.72);--ink:#EEF2F0;--muted:#9AA6A3;--line:#2A3633;--err:#F2B8B5;--field:#0E1413}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--page);
  background-image:radial-gradient(60rem 40rem at 15% 10%,rgba(43,70,66,.22),transparent 60%),radial-gradient(50rem 36rem at 90% 90%,rgba(244,183,64,.18),transparent 60%);
  display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;padding:36px 32px 32px;border-radius:28px;background:var(--card);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 20px 60px rgba(21,32,30,.14),inset 0 1px 0 rgba(255,255,255,.4)}
.mark{width:44px;height:44px;border-radius:14px;background:var(--brand);display:grid;place-items:center;margin-bottom:20px}
.mark svg{width:22px;height:22px;stroke:#fff}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
p{margin:0 0 24px;color:var(--muted);font-size:15px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
.field{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:14px 48px 14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(43,70,66,.18)}
input[aria-invalid="true"]{border-color:var(--err)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--ink)}
.eye svg{width:20px;height:20px}
.err{min-height:20px;margin:8px 0 12px;font-size:13px;color:var(--err)}
button[type=submit]{width:100%;font:inherit;font-size:15px;font-weight:600;padding:14px;border:0;border-radius:999px;background:var(--sun);color:#15201E;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
button[type=submit]:hover{filter:brightness(1.05)}
button[type=submit]:active{transform:scale(.98)}
button[disabled]{opacity:.7;cursor:progress}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>The Flex Academy</h1>
  <p>This preview is private. Enter the password to continue.</p>
  <form id="f" novalidate>
    <label for="pw">Password</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password" autofocus required aria-describedby="err">
      <button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button type="submit" id="go">Unlock</button>
  </form>
</main>
<script>
var PAYLOAD=/*PAYLOAD*/null;
(function(){
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go'),card=document.getElementById('card'),eye=document.getElementById('eye');
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function fail(msg){err.textContent=msg;pw.setAttribute('aria-invalid','true');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');go.disabled=false;go.textContent='Unlock';pw.select()}
  eye.addEventListener('click',function(){var show=pw.type==='password';pw.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password');pw.focus()});
  pw.addEventListener('input',function(){err.textContent='';pw.removeAttribute('aria-invalid')});
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!pw.value){fail('Please enter the password.');return}
    if(!window.crypto||!crypto.subtle){fail('This browser can’t unlock the page. Try an up-to-date Chrome, Edge, Safari or Firefox.');return}
    go.disabled=true;go.textContent='Unlocking…';
    try{
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
    }catch(x){fail('That password isn’t right. Try again.');return}
    var html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  });
})();
</script>
</body>
</html>
